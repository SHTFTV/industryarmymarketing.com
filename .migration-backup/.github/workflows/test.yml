name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]
    name: vitest (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Compute lockfile hash
        id: lockhash
        run: |
          # hashFiles() in GitHub expressions uses SHA-256 of file contents;
          # for a single lockfile, sha256sum produces the same digest used
          # in the setup-node cache key.
          HASH=$(sha256sum package-lock.json | awk '{print $1}')
          SHORT="${HASH:0:12}"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "package-lock.json sha256: $HASH"
      - name: Print cache key inputs
        env:
          LOCK_HASH: ${{ steps.lockhash.outputs.hash }}
        run: |
          NODE_ACTUAL=$(node --version)
          # Each component on its own line so a miss can be diffed against
          # the previous run at a glance (OS, arch, Node major, lockfile).
          echo "── npm cache key inputs ─────────────────────────"
          echo "  os               = ${RUNNER_OS}"
          echo "  arch             = ${RUNNER_ARCH}"
          echo "  node_matrix      = ${{ matrix.node-version }}"
          echo "  node_actual      = ${NODE_ACTUAL}"
          echo "  lockfile         = package-lock.json"
          echo "  lockfile_sha256  = ${LOCK_HASH}"
          echo "  composed_key     = node-cache-${RUNNER_OS}-${RUNNER_ARCH}-npm-${LOCK_HASH}"
          echo "─────────────────────────────────────────────────"
          {
            echo "### Cache key inputs — Node ${{ matrix.node-version }}"
            echo ""
            echo "| Input | Value |"
            echo "| --- | --- |"
            echo "| OS | \`${RUNNER_OS}\` |"
            echo "| Architecture | \`${RUNNER_ARCH}\` |"
            echo "| Node (matrix) | \`${{ matrix.node-version }}\` |"
            echo "| Node (actual) | \`${NODE_ACTUAL}\` |"
            echo "| Lockfile | \`package-lock.json\` |"
            echo "| Lockfile sha256 | \`${LOCK_HASH}\` |"
            echo "| Composed key | \`node-cache-${RUNNER_OS}-${RUNNER_ARCH}-npm-${LOCK_HASH}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report npm cache restore result
        id: cache-report
        env:
          LOCK_HASH: ${{ steps.lockhash.outputs.hash }}
          LOCK_SHORT: ${{ steps.lockhash.outputs.short }}
        run: |
          HIT='${{ steps.setup-node.outputs.cache-hit }}'
          CACHE_KEY="node-cache-${RUNNER_OS}-${RUNNER_ARCH}-npm-${LOCK_HASH}"
          KEY_PREFIX="node-cache-${RUNNER_OS}-${RUNNER_ARCH}-npm-"
          echo "setup-node cache-hit output: '${HIT:-<empty>}'"
          echo "reconstructed cache key: $CACHE_KEY"
          if [ "$HIT" = "true" ]; then
            STATUS="hit"
            ICON="✅ HIT"
            echo "::notice title=npm cache::HIT key=$CACHE_KEY"
          else
            STATUS="miss"
            ICON="❌ MISS"
            echo "::notice title=npm cache::MISS key=$CACHE_KEY (no exact match — will save at job end)"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "key_prefix=$KEY_PREFIX" >> "$GITHUB_OUTPUT"
          echo "icon=$ICON" >> "$GITHUB_OUTPUT"

      - name: Diagnose cache miss reason
        id: miss-reason
        if: steps.cache-report.outputs.status == 'miss'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.cache-report.outputs.key }}
          KEY_PREFIX: ${{ steps.cache-report.outputs.key_prefix }}
          LOCK_HASH: ${{ steps.lockhash.outputs.hash }}
        run: |
          set -e
          # List existing caches in this repo. Requires actions:read.
          # Output: KEY<tab>SIZE<tab>REF<tab>LAST_ACCESSED
          ALL=$(gh cache list --limit 100 --ref "${GITHUB_REF}" 2>/dev/null \
                || gh cache list --limit 100 2>/dev/null \
                || true)

          MATCH_PREFIX=$(echo "$ALL" | awk -v p="$KEY_PREFIX" '$1 ~ "^"p {print $1}' || true)
          MATCH_LOCK=$(echo "$ALL" | awk -v h="$LOCK_HASH" 'index($1, h) {print $1}' || true)

          # General cross-OS/arch caches built from the same lockfile.
          NPM_ANY_LOCK=$(echo "$ALL" | awk -v h="$LOCK_HASH" '$1 ~ /^node-cache-/ && index($1, h) {print $1}' || true)

          REASON=""
          DETAIL=""

          if [ -z "$ALL" ]; then
            REASON="no_cache_api_access"
            DETAIL="Could not list repo caches (missing actions:read or empty cache store). Cache will be saved at job end."
          elif [ -z "$MATCH_PREFIX" ] && [ -z "$NPM_ANY_LOCK" ]; then
            REASON="first_run"
            DETAIL="No prior npm cache exists for this OS/arch/Node combo or this lockfile hash. Expected on first run after enabling caching or after cache eviction (7-day GitHub TTL / 10GB repo limit)."
          elif [ -z "$MATCH_PREFIX" ] && [ -n "$NPM_ANY_LOCK" ]; then
            REASON="runner_changed"
            DETAIL="Caches with the same lockfile hash exist but for a different OS/arch. Current runner=${RUNNER_OS}/${RUNNER_ARCH}. Found: $(echo "$NPM_ANY_LOCK" | tr '\n' ' ')"
          elif [ -n "$MATCH_PREFIX" ] && [ -z "$MATCH_LOCK" ]; then
            REASON="lockfile_changed"
            PRIOR=$(echo "$MATCH_PREFIX" | head -n1)
            PRIOR_HASH="${PRIOR##${KEY_PREFIX}}"
            DETAIL="A prior cache exists for this OS/arch/Node combo with a different lockfile hash. current=${LOCK_HASH:0:12}… prior=${PRIOR_HASH:0:12}… (key=${PRIOR}). Likely cause: package-lock.json was modified."
          else
            REASON="key_mismatch_unknown"
            DETAIL="Caches with the expected prefix exist (e.g. $(echo "$MATCH_PREFIX" | head -n1)) but setup-node still reported a miss. Possible causes: cache being uploaded by a parallel run, scope/ref mismatch (caches are scoped to base branch), or eviction in flight."
          fi

          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"
          echo "::warning title=npm cache miss reason::${REASON}: ${DETAIL}"

      - name: List existing caches matching key prefix
        if: steps.cache-report.outputs.status == 'miss'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_PREFIX: ${{ steps.cache-report.outputs.key_prefix }}
          CURRENT_KEY: ${{ steps.cache-report.outputs.key }}
        run: |
          set -e
          # Pull cache entries with structured fields so we can print
          # IDs and timestamps for every entry whose key starts with the
          # composed prefix (node-cache-<os>-<arch>-npm-).
          JSON=$(gh cache list --limit 100 \
                   --json id,key,ref,sizeInBytes,createdAt,lastAccessedAt \
                   2>/dev/null || echo '[]')

          MATCHES=$(echo "$JSON" | jq --arg p "$KEY_PREFIX" \
            '[.[] | select(.key | startswith($p))]
             | sort_by(.lastAccessedAt) | reverse')
          COUNT=$(echo "$MATCHES" | jq 'length')

          echo "── caches matching prefix: ${KEY_PREFIX} ──"
          echo "current key: ${CURRENT_KEY}"
          echo "matches found: ${COUNT}"
          if [ "$COUNT" -gt 0 ]; then
            echo "$MATCHES" | jq -r '.[] |
              "  id=\(.id)  size=\(.sizeInBytes)B  created=\(.createdAt)  last_accessed=\(.lastAccessedAt)  ref=\(.ref)\n    key=\(.key)"'
          else
            echo "  (no entries — first run for this prefix or all evicted)"
          fi
          echo "─────────────────────────────────────────────"

          {
            echo "### Existing caches matching prefix — Node ${{ matrix.node-version }}"
            echo ""
            echo "Prefix: \`${KEY_PREFIX}\`  "
            echo "Current key: \`${CURRENT_KEY}\`  "
            echo "Matches: **${COUNT}**"
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "| ID | Size (B) | Created | Last accessed | Ref | Key |"
              echo "| --- | --- | --- | --- | --- | --- |"
              echo "$MATCHES" | jq -r '.[] |
                "| \(.id) | \(.sizeInBytes) | \(.createdAt) | \(.lastAccessedAt) | `\(.ref)` | `\(.key)` |"'
            else
              echo "_No entries — first run for this prefix or all evicted (GitHub 7-day TTL / 10GB repo limit)._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Search for exact cache key match
        if: steps.cache-report.outputs.status == 'miss'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.cache-report.outputs.key }}
        run: |
          set -e
          # Look for an entry whose key === composed key. If one exists
          # despite setup-node reporting a miss, the cause is almost
          # always scope/ref isolation: caches created on a feature
          # branch are not readable from another branch (only the base
          # branch + the branch itself can read them).
          JSON=$(gh cache list --limit 100 \
                   --key "$CURRENT_KEY" \
                   --json id,key,ref,sizeInBytes,createdAt,lastAccessedAt \
                   2>/dev/null || echo '[]')
          COUNT=$(echo "$JSON" | jq 'length')

          echo "── exact cache key search ──"
          echo "looking for key: ${CURRENT_KEY}"
          echo "matches: ${COUNT}"
          if [ "$COUNT" -gt 0 ]; then
            echo "$JSON" | jq -r '.[] |
              "  id=\(.id)  ref=\(.ref)  size=\(.sizeInBytes)B  created=\(.createdAt)  last_accessed=\(.lastAccessedAt)"'
            echo "::warning title=npm cache scope mismatch::Exact key '${CURRENT_KEY}' exists on a different ref/branch and is not readable from this run. Caches are scoped to their creating ref + the repo's default branch."
          else
            echo "  (no exact-key entry exists in this repo)"
          fi
          echo "────────────────────────────"

          {
            echo "### Exact cache key search — Node ${{ matrix.node-version }}"
            echo ""
            echo "Looking for key: \`${CURRENT_KEY}\`  "
            echo "Matches: **${COUNT}**"
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "> ⚠️ Exact key exists but was not restored — likely a **scope/ref mismatch** (caches are only readable from their creating ref or the default branch)."
              echo ""
              echo "| ID | Ref | Size (B) | Created | Last accessed |"
              echo "| --- | --- | --- | --- | --- |"
              echo "$JSON" | jq -r '.[] |
                "| \(.id) | `\(.ref)` | \(.sizeInBytes) | \(.createdAt) | \(.lastAccessedAt) |"'
            else
              echo "_No exact-key entry exists. The miss is due to the key never having been saved (first run, lockfile change, or eviction) — not a scope issue._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write cache report to summary
        env:
          LOCK_HASH: ${{ steps.lockhash.outputs.hash }}
          STATUS: ${{ steps.cache-report.outputs.status }}
          ICON: ${{ steps.cache-report.outputs.icon }}
          CACHE_KEY: ${{ steps.cache-report.outputs.key }}
          MISS_REASON: ${{ steps.miss-reason.outputs.reason }}
          MISS_DETAIL: ${{ steps.miss-reason.outputs.detail }}
        run: |
          {
            echo "### npm cache — Node ${{ matrix.node-version }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | $ICON |"
            echo "| Node | ${{ matrix.node-version }} |"
            echo "| Runner | \`${RUNNER_OS}/${RUNNER_ARCH}\` |"
            echo "| Lockfile sha256 | \`${LOCK_HASH}\` |"
            echo "| Cache key | \`${CACHE_KEY}\` |"
            if [ "$STATUS" = "miss" ]; then
              echo "| Miss reason | \`${MISS_REASON:-unknown}\` |"
              echo ""
              echo "> ${MISS_DETAIL:-No diagnosis available.}"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p cache-report
          {
            echo "status=$STATUS"
            echo "node=${{ matrix.node-version }}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "lock_hash=$LOCK_HASH"
            echo "lock_short=${LOCK_HASH:0:12}"
            echo "key=$CACHE_KEY"
            echo "miss_reason=${MISS_REASON}"
            echo "miss_detail=${MISS_DETAIL}"
          } > "cache-report/node-${{ matrix.node-version }}.env"

      - name: Upload cache report
        uses: actions/upload-artifact@v4
        with:
          name: cache-report-node-${{ matrix.node-version }}
          path: cache-report/
          retention-days: 1

      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test

  cache-summary:
    name: npm cache hit rate
    runs-on: ubuntu-latest
    needs: vitest
    if: always()
    steps:
      - name: Download all cache reports
        uses: actions/download-artifact@v4
        with:
          path: cache-reports
          pattern: cache-report-node-*
          merge-multiple: true
      - name: Aggregate hit rate
        run: |
          shopt -s nullglob
          files=(cache-reports/node-*.env)
          total=${#files[@]}
          hits=0
          rows=""
          miss_rows=""
          for f in "${files[@]}"; do
            status="" node="" runner="" lock_short="" key="" miss_reason="" miss_detail=""
            while IFS='=' read -r k v; do
              case "$k" in
                status) status="$v" ;;
                node) node="$v" ;;
                runner) runner="$v" ;;
                lock_short) lock_short="$v" ;;
                key) key="$v" ;;
                miss_reason) miss_reason="$v" ;;
                miss_detail) miss_detail="$v" ;;
              esac
            done < "$f"
            if [ "$status" = "hit" ]; then
              hits=$((hits + 1))
              icon="✅ HIT"
              reason_cell="—"
            else
              icon="❌ MISS"
              reason_cell="\`${miss_reason:-unknown}\`"
              miss_rows+="- **Node ${node}** (\`${miss_reason:-unknown}\`): ${miss_detail:-No diagnosis available.}"$'\n'
            fi
            rows+="| ${node} | ${icon} | \`${runner}\` | \`${lock_short}\` | ${reason_cell} |"$'\n'
          done
          if [ "$total" -gt 0 ]; then
            rate=$(awk -v h="$hits" -v t="$total" 'BEGIN{printf "%.0f", (h/t)*100}')
          else
            rate=0
          fi
          {
            echo "## npm cache hit rate"
            echo ""
            echo "**${hits}/${total} jobs hit the cache (${rate}%)**"
            echo ""
            if [ "$total" -gt 0 ]; then
              echo "| Node | Result | Runner | Lock (short) | Miss reason |"
              echo "| --- | --- | --- | --- | --- |"
              printf "%s" "$rows"
              if [ -n "$miss_rows" ]; then
                echo ""
                echo "### Miss details"
                echo ""
                printf "%s" "$miss_rows"
              fi
            else
              echo "_No cache reports found._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "npm cache hit rate: ${hits}/${total} (${rate}%)"
