<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-m54Ev+Jkrnuj2pzI+WIZCIl13RkdJRpiXZ/qackTUBo='; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://industryarmymarketing.com https://www.industryarmymarketing.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co ws://localhost:* http://localhost:*; frame-src https://www.youtube.com https://www.google.com; manifest-src 'self'; worker-src 'self' blob:; media-src 'self'; upgrade-insecure-requests"
    />
    <!--
      Per-page <title>, <meta name="description">, canonical, og:*, twitter:*
      are injected by <Seo> (react-helmet-async) and captured into static HTML
      by react-snap at build time. The values below are the fallback that
      ships only on non-prerendered / SPA-navigated views.
    -->
    <title>Industry Army Marketing | Territory Marketing for Any Industry | Est. 2015</title>
    <meta name="description" content="Industry Army Marketing — Territory-locked marketing for any industry. The 250 Scale: $10–$50/slot/month. TALC.tv $10/post. EyeSpyR verification. Any city. Any trade. Est. 2015." />
    <meta name="author" content="Industry Army Marketing" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#caff00" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Industry Army Marketing — Intel Blog" href="/rss.xml" />
    <meta name="theme-color" content="#caff00" />

    <!--
      og:site_name is the only OG tag left static — it never varies per page.
      Per-page og:title/description/url/type/image and twitter:* are emitted
      by <Seo> and captured by react-snap. Keeping duplicate static og:* tags
      here would produce two competing values in the prerendered HTML,
      which social crawlers resolve inconsistently.
    -->
    <meta property="og:site_name" content="Industry Army Marketing" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://industryarmymarketing.com/#organization",
            "name": "Industry Army Marketing",
            "legalName": "Industry Army Marketing",
            "url": "https://industryarmymarketing.com",
            "foundingDate": "2011",
            "description": "The founding network and master digital infrastructure platform for exclusive trade and lifestyle territories.",
            "email": "colin@industryarmymarketing.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://industryarmymarketing.com/icon-512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://industryarmymarketing.com/icon-512.png",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Langley",
              "addressRegion": "BC",
              "addressCountry": "CA"
            },
            "sameAs": [
              "https://www.linkedin.com/in/colin-hamilton-5a9299407/"
            ],
            "subOrganization": [
              { "@type": "Organization", "name": "Gasfitter.ca", "url": "https://gasfitter.ca" },
              { "@type": "Organization", "name": "Plowwow.com", "url": "https://plowwow.com" }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://industryarmymarketing.com/#website",
            "url": "https://industryarmymarketing.com",
            "name": "Industry Army Marketing",
            "publisher": { "@id": "https://industryarmymarketing.com/#organization" }
          },
          {
            "@type": "ItemList",
            "@id": "https://industryarmymarketing.com/#nav-list",
            "name": "Main Navigation",
            "itemListElement": [
              { "@type": "SiteNavigationElement", "position": 1, "name": "How It Works", "url": "https://industryarmymarketing.com/how-it-works" },
              { "@type": "SiteNavigationElement", "position": 2, "name": "Pricing", "url": "https://industryarmymarketing.com/pricing" },
              { "@type": "SiteNavigationElement", "position": 3, "name": "Network", "url": "https://industryarmymarketing.com/network" },
              { "@type": "SiteNavigationElement", "position": 4, "name": "EyeSpyr", "url": "https://industryarmymarketing.com/eyespyr" },
              { "@type": "SiteNavigationElement", "position": 5, "name": "Blog", "url": "https://industryarmymarketing.com/blog" },
              { "@type": "SiteNavigationElement", "position": 6, "name": "Guest Post", "url": "https://industryarmymarketing.com/guest-post" },
              { "@type": "SiteNavigationElement", "position": 7, "name": "Free Scan", "url": "https://industryarmymarketing.com/scan-wizard" },
              { "@type": "SiteNavigationElement", "position": 8, "name": "Contact", "url": "https://industryarmymarketing.com/contact" }
            ]
          }
        ]
      }

  </head>
