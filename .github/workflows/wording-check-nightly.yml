name: Nightly Wording Check

on:
  schedule:
    # 08:00 UTC every day
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  wording-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run wording check
        id: check
        run: |
          set +e
          OUTPUT=$(node scripts/check-wording.mjs 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo "report<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Nightly wording check failed on \`${context.sha.slice(0,7)}\`.\n\n\`\`\`\n${`${{ steps.check.outputs.report }}`}\n\`\`\`\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Wording check failed — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['wording-check', 'automated'],
            });