name: Nightly Wording Check

on:
  schedule:
    # 08:00 UTC every day
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  wording-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run wording check
        id: check
        run: |
          set +e
          OUTPUT=$(node scripts/check-wording.mjs 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo "report<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Nightly wording check failed on \`${context.sha.slice(0,7)}\`.\n\n\`\`\`\n${`${{ steps.check.outputs.report }}`}\n\`\`\`\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Wording check failed — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['wording-check', 'automated'],
            });

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT: ${{ steps.check.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Truncate report to keep Slack payload under limits
          TRUNCATED=$(printf '%s' "$REPORT" | head -c 2500)
          PAYLOAD=$(jq -n \
            --arg text "🚨 Nightly wording check failed on \`${GITHUB_REPOSITORY}\`" \
            --arg report "$TRUNCATED" \
            --arg url "$RUN_URL" \
            '{
              text: $text,
              blocks: [
                { type: "header", text: { type: "plain_text", text: "🚨 Wording check failed" } },
                { type: "section", text: { type: "mrkdwn", text: ("*Repo:* `" + env.GITHUB_REPOSITORY + "`\n*Commit:* `" + env.GITHUB_SHA[0:7] + "`") } },
                { type: "section", text: { type: "mrkdwn", text: ("*Offending lines:*\n```" + $report + "```") } },
                { type: "actions", elements: [ { type: "button", text: { type: "plain_text", text: "View run" }, url: $url } ] }
              ]
            }')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"