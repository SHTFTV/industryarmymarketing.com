# Required CI gate: runs the extended live cache-header Playwright suite
# and the multi-run HTML freshness verifier against the deployed origin.
#
# Triggers:
#   - Every PR (verifies the currently published prod site is healthy so
#     merges never happen while the CDN is serving stale HTML).
#   - Every push to `main` (post-merge safety net).
#   - Manually via workflow_dispatch after a Lovable publish, with an
#     optional `base_url` override.
#
# Uploads a CI artifact (`cache-report/`) containing report.json + report.md
# so failing runs are easy to diagnose: every checked URL is listed with
# its status, cache-control headers, and cross-run diffs.

name: Live cache + freshness gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live origin to verify (defaults to production)"
        required: false
        default: "https://www.industryarmymarketing.com"

permissions:
  contents: read

concurrency:
  group: live-cache-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-cache-verify:
    name: Extended cache headers + HTML freshness
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ github.event.inputs.base_url || 'https://www.industryarmymarketing.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Extended cache-header Playwright checks (required gate)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.LIVE_URL }}
        run: npx playwright test tests/live-cache-headers.spec.ts tests/live-cache-headers-extended.spec.ts --project=chromium --reporter=list

      - name: HTML freshness verifier (multi-run, cross-edge)
        env:
          BASE_URL: ${{ env.LIVE_URL }}
          RUNS: "4"
        run: npx tsx scripts/verify-fresh-html.ts

      - name: Append report to job summary
        if: always()
        run: |
          if [ -f cache-report/report.md ]; then
            cat cache-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No cache-report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload cache-report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache-report/
          if-no-files-found: warn
          retention-days: 30