name: Lookalike Domain Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile || bun install
      - name: Run lookalike-domain guard
        id: guard
        continue-on-error: true
        run: node scripts/check-lookalike-domains.mjs
      - name: Export release audit
        if: always()
        env:
          RELEASE: ${{ github.sha }}
          EXPORT_AUDIT_STRICT: "0"
        run: node scripts/export-audit.mjs
      - name: Upload audit artifact
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ github.sha }}
          path: |
            audit-report/**
            public/audit/**
          retention-days: 30
      - name: Notify Slack / GitHub
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ github.sha }}
          AUDIT_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: node scripts/notify-guard.mjs
      - name: Fail if guard failed
        if: steps.guard.outcome == 'failure'
        run: exit 1
