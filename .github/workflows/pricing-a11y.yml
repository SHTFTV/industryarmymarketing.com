# Runs on every pull request (and pushes to main).
#
# Executes the axe + keyboard-navigation Playwright suite for /pricing and
# /contact so accessibility regressions and analytics-duplication bugs
# surface before merge.
#
# VITE_GA4_MEASUREMENT_ID is set to a placeholder so the GA4 mirror in
# src/lib/analytics.ts activates and the tests can assert gtag() calls
# without ever loading the real Google Tag Manager script (blocked in-test
# via page.route abort).

name: Pricing a11y + analytics

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pricing-a11y:
    name: Playwright a11y + analytics (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      CI: "true"
      # Placeholder GA4 id so the GA4 mirror is compiled into the app during
      # `vite dev`. Test route interception blocks the real tag script.
      VITE_GA4_MEASUREMENT_ID: G-TEST12345
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Hard gate: fail the PR if any engine's baselines are missing, so
      # the visual suite can't silently stay skipped. Runs once per matrix
      # leg but checks all three engines (cheap and deterministic).
      - name: Verify pricing visual baselines are committed (all engines)
        run: node scripts/pricing-visual-checksums.mjs --check
      - name: Run pricing CTA + a11y suite
        run: npx playwright test tests/pricing-cta-flow.spec.ts --project=${{ matrix.browser }} --reporter=list
      # With the gate above green, this branch's baselines are guaranteed
      # to exist. We still print a clear log message if — for any reason —
      # this engine's snapshot files disappear between steps, and skip the
      # suite with an explicit reason instead of a silent success.
      - name: Check for this engine's visual baselines
        id: visual_baselines
        run: |
          set -euo pipefail
          SNAP_DIR="tests/pricing-visual.spec.ts-snapshots"
          ENGINE="${{ matrix.browser }}"
          if [ -d "$SNAP_DIR" ] && ls "$SNAP_DIR"/*-"$ENGINE"-* >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual baselines::Found $(ls "$SNAP_DIR"/*-"$ENGINE"-* | wc -l) $ENGINE snapshot(s) in $SNAP_DIR"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Pricing visual suite skipped for $ENGINE"
              echo ""
              echo "**Reason:** no baseline PNGs found in \`$SNAP_DIR\` matching \`*-$ENGINE-*.png\`."
              echo ""
              echo "**How to seed:**"
              echo "1. Run the **Pricing visual baselines (seed)** workflow (Actions → Run workflow) for \`$ENGINE\`."
              echo "2. Download the \`pricing-visual-baselines-$ENGINE\` artifact."
              echo "3. Commit the PNGs into \`$SNAP_DIR/\` and reopen the PR."
              echo ""
              echo "Missing set snapshot checksum:"
              node scripts/pricing-visual-checksums.mjs || true
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Visual baselines missing::No $ENGINE snapshots in $SNAP_DIR — see the job summary for seed instructions."
            exit 1
          fi
      - name: Print baseline set checksum (audit trail)
        if: steps.visual_baselines.outputs.present == 'true'
        run: node scripts/pricing-visual-checksums.mjs
      - name: Run pricing visual regression suite
        if: steps.visual_baselines.outputs.present == 'true'
        run: npx playwright test tests/pricing-visual.spec.ts --project=${{ matrix.browser }} --reporter=list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-a11y-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7