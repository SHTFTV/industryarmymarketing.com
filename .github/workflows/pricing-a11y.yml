# Runs on every pull request (and pushes to main).
#
# Executes the axe + keyboard-navigation Playwright suite for /pricing and
# /contact so accessibility regressions and analytics-duplication bugs
# surface before merge.
#
# VITE_GA4_MEASUREMENT_ID is set to a placeholder so the GA4 mirror in
# src/lib/analytics.ts activates and the tests can assert gtag() calls
# without ever loading the real Google Tag Manager script (blocked in-test
# via page.route abort).

name: Pricing a11y + analytics

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pricing-a11y:
    name: Playwright a11y + analytics (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      CI: "true"
      # Placeholder GA4 id so the GA4 mirror is compiled into the app during
      # `vite dev`. Test route interception blocks the real tag script.
      VITE_GA4_MEASUREMENT_ID: G-TEST12345
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run pricing CTA + a11y suite
        run: npx playwright test tests/pricing-cta-flow.spec.ts --project=${{ matrix.browser }} --reporter=list
      # Visual regression suite runs only when baselines exist for this
      # engine. Seed them via the `Pricing visual baselines (seed)` workflow
      # and commit the artifact into tests/pricing-visual.spec.ts-snapshots/.
      - name: Check for visual baselines
        id: visual_baselines
        run: |
          if [ -d "tests/pricing-visual.spec.ts-snapshots" ] && \
             ls tests/pricing-visual.spec.ts-snapshots/*-${{ matrix.browser }}-* >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pricing visual regression suite
        if: steps.visual_baselines.outputs.present == 'true'
        run: npx playwright test tests/pricing-visual.spec.ts --project=${{ matrix.browser }} --reporter=list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-a11y-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7