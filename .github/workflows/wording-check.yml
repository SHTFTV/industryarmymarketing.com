name: Wording Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wording-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run wording check
        id: check
        run: |
          set +e
          OUTPUT=$(node scripts/check-wording.mjs 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo "report<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Comment on PR (with cooldown)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
          ISSUE_COOLDOWN_HOURS: ${{ vars.ISSUE_COOLDOWN_HOURS }}
        with:
          script: |
            const crypto = require('crypto');
            const report = process.env.REPORT || '';
            const cooldownH = parseInt(process.env.ISSUE_COOLDOWN_HOURS || '0', 10);
            const fingerprint = crypto.createHash('sha256').update(report).digest('hex').slice(0, 16);
            const marker = `<!-- wording-check:fp=${fingerprint} -->`;
            const tsRe = /<!-- wording-check:ts=(\d+) -->/;
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Look for an existing bot comment with the same fingerprint.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const prior = comments.find(c => (c.body || '').includes(marker));

            if (cooldownH > 0 && prior) {
              const m = (prior.body || '').match(tsRe);
              const last = m ? parseInt(m[1], 10) : Math.floor(new Date(prior.created_at).getTime() / 1000);
              const ageMin = Math.floor((Date.now() / 1000 - last) / 60);
              if (ageMin < cooldownH * 60) {
                core.notice(`PR comment suppressed — same failure already commented ${ageMin}m ago (cooldown: ${cooldownH}h, fingerprint: ${fingerprint}).`);
                return;
              }
            }

            const truncated = report.length > 5000 ? report.slice(0, 5000) + '\n…(truncated)' : report;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `❌ **Wording check failed** on \`${context.sha.slice(0, 7)}\`.`,
              '',
              '```',
              truncated,
              '```',
              '',
              `[View workflow run](${runUrl})`,
              '',
              marker,
              `<!-- wording-check:ts=${Math.floor(Date.now() / 1000)} -->`,
            ].join('\n');

            // Retry helper: exponential backoff for 429/5xx and transient
            // network errors (ECONNRESET, ETIMEDOUT, etc.). Honors the
            // Retry-After header when GitHub provides one.
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const isRetryable = (err) => {
              const s = err && err.status;
              if (s === 429 || s === 408 || (s >= 500 && s <= 599)) return true;
              const code = err && (err.code || (err.cause && err.cause.code));
              return ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND', 'ECONNREFUSED', 'EPIPE'].includes(code);
            };
            // Coalesce per-retry warnings into a single ::warning:: per
            // burst so the Actions log isn't flooded when GitHub is flaky.
            const withRetry = async (label, fn, { retries = 5, baseMs = 1000, capMs = 30000 } = {}) => {
              let attempt = 0;
              const burst = []; // { attempt, status, message, waitMs }
              const flush = (outcome) => {
                if (!burst.length) return;
                const first = burst[0];
                const last = burst[burst.length - 1];
                const totalWait = burst.reduce((s, b) => s + b.waitMs, 0);
                const reasons = [...new Set(burst.map(b => `${b.status}: ${b.message}`))];
                const summary =
                  `${label}: ${burst.length} retry attempt(s) coalesced — ` +
                  `outcome=${outcome}, ` +
                  `attempts=${first.attempt}-${last.attempt}/${retries}, ` +
                  `total_backoff=${totalWait}ms, ` +
                  `reasons=[${reasons.join(' | ')}]`;
                if (outcome === 'recovered') core.warning(summary);
                else core.error(summary);
                burst.length = 0;
              };
              for (;;) {
                try {
                  const result = await fn();
                  flush('recovered');
                  return result;
                } catch (err) {
                  attempt += 1;
                  if (attempt > retries || !isRetryable(err)) {
                    flush('failed');
                    throw err;
                  }
                  const retryAfter = parseInt(err?.response?.headers?.['retry-after'] || '0', 10);
                  const backoff = Math.min(capMs, baseMs * 2 ** (attempt - 1));
                  const jitter = Math.floor(Math.random() * 250);
                  const waitMs = (retryAfter > 0 ? retryAfter * 1000 : backoff) + jitter;
                  burst.push({
                    attempt,
                    status: err.status || err.code || 'error',
                    message: err.message,
                    waitMs,
                  });
                  await sleep(waitMs);
                }
              }
            };

            const createNew = async (reason) => {
              if (reason) core.notice(reason);
              await withRetry('createComment', () =>
                github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber, body,
                })
              );
            };

            if (prior) {
              try {
                await withRetry('updateComment', () =>
                  github.rest.issues.updateComment({
                    owner, repo, comment_id: prior.id, body,
                  })
                );
                core.notice(`Updated existing wording-check comment #${prior.id} (fingerprint: ${fingerprint}).`);
              } catch (err) {
                // Fallback: prior comment may have been deleted (404),
                // edited by a different account (403), or otherwise
                // unreachable — post a fresh comment instead of failing.
                await createNew(`Update of comment #${prior.id} failed (${err.status || 'error'}: ${err.message}); posting a new comment instead.`);
              }
            } else {
              await createNew();
            }