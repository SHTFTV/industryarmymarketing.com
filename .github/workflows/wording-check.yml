name: Wording Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wording-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run wording check
        run: node scripts/check-wording.mjs