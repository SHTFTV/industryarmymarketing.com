name: IAM sole-publisher health recovery
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iam-health.yml'
      - 'scripts/iam-health-recovery.py'
      - 'scripts/test_iam_health_recovery.py'
      - 'docs/IAM-SOT.md'
      - 'operations/iam/build-contract.json'
permissions:
  contents: read
  actions: write
concurrency:
  group: iam-health-recovery
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Health dispatch regressions
        run: python -m unittest discover -s scripts -p test_iam_health_recovery.py
      - name: Check and recover the existing publisher only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/iam-health-recovery.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iam-supervisor-proof-${{ github.run_id }}
          path: operations/iam/supervisor-proof/
          if-no-files-found: ignore
          retention-days: 7
