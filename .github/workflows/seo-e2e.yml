name: SEO E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: seo-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rss-sitemap-enclosure:
    name: RSS ↔ sitemap enclosure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Vitest — enclosure + all-post SEO parity + JSON-LD dates
        id: vitest
        run: |
          set +e
          npx vitest run \
            --reporter=default --reporter=json --outputFile=vitest-seo.json \
            src/test/iam-perspective-post.test.ts \
            src/test/blog-posts-seo-parity.test.ts \
            src/test/blog-jsonld-dates.test.ts \
            src/pages/BlogPost.robotsSitemapSchema.test.tsx
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload vitest report
        if: always()
        id: upload_vitest
        uses: actions/upload-artifact@v4
        with:
          name: seo-vitest-report
          path: |
            vitest-seo.json
      - name: Wait for Playwright + OG image jobs (for artifact URLs)
        # We link to sibling job artifacts in the PR comment. The GitHub
        # artifact URLs resolve to the workflow run's Artifacts tab, so we
        # only need the run id — not the individual artifact ids.
        run: 'echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_ENV"'
      - name: Summarize SEO failures
        if: always()
        env:
          SEO_COMMENT_OUT: seo-comment.md
          RUN_URL: ${{ env.run_url }}
          VITEST_REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          PLAYWRIGHT_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          OG_IMAGE_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          node scripts/summarize-seo-failures.mjs vitest-seo.json || true
      - name: Upload PR comment body
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-pr-comment
          path: seo-comment.md
      - name: Comment PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('seo-comment.md')) return;
            const body = fs.readFileSync('seo-comment.md', 'utf8');
            const marker = '<!-- seo-failures-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail job if any SEO check failed
        if: steps.vitest.outputs.exit_code != '0'
        run: exit 1

  playwright-e2e:
    name: Playwright E2E SEO (published URL)
    runs-on: ubuntu-latest
    env:
      BLOG_URL: https://www.industryarmymarketing.com/blog/iam-perspective-committed-people-not-capital
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E SEO check
        run: npx tsx scripts/e2e-blog-seo.ts --url=$BLOG_URL 2>&1 | tee e2e-blog-seo.log
      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blog-seo-log
          path: e2e-blog-seo.log

  live-og-images:
    name: Live OG image reachability
    runs-on: ubuntu-latest
    # Best-effort: OG image drift shouldn't block a PR that only edits code.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Fetch every published OG image
        env:
          RUN_LIVE_OG_CHECK: "1"
        run: npx vitest run src/test/blog-og-images-live.test.ts 2>&1 | tee og-image-check.log
      - name: Upload OG image log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: og-image-check-log
          path: og-image-check.log
