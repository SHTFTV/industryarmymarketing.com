# On every PR (and pushes to main), verify two invariants that block a lot
# of subtle content bugs:
#   1) The RSS/blog JSON-LD sync smoke test — public/rss.xml, public/sitemap.xml,
#      and src/data/blogPosts.ts stay in lockstep.
#   2) A TypeScript typecheck of the app sources (no emit) so schema/type
#      regressions from a content edit surface before merge.
#   3) The disambiguation stack: regenerate public/identity.txt from the shared
#      config, then run the schema / cross-link / sitemap-parse vitest suites
#      that guard the weddings.io ⇄ industryarmymarketing.com binding.
#   4) The Playwright E2E suite (Chromium) — record page loads with
#      DisambiguationSchema and the DisambiguationNotice banner renders on
#      every configured route.

name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rss-sync:
    name: RSS blog JSON-LD sync smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run RSS/blog sync smoke test
        run: npx vitest run src/test/rss-blog-sync.test.ts --reporter=verbose

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: tsc --noEmit
        # tsconfig.json references tsconfig.app.json + tsconfig.node.json;
        # -b runs both projects without emitting output.
        run: npx tsc -b --noEmit

  disambiguation:
    name: Disambiguation stack (identity.txt + schema + cross-link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Regenerate public/identity.txt from shared config
        run: npx tsx scripts/generate-identity-txt.ts
      - name: Regenerate public/sitemap.xml from shared config
        run: npx tsx scripts/generate-sitemap.ts
      - name: Run disambiguation vitest suites
        run: |
          npx vitest run \
            src/test/identity-txt.test.ts \
            src/test/sitemap-record.test.ts \
            src/test/sitemap-parse.test.ts \
            src/components/DisambiguationSchema.sameAs.test.tsx \
            src/components/DisambiguationNotice.test.tsx \
            src/pages/BlogPost.crossLink.test.tsx \
            src/pages/BlogPost.disambiguation.test.tsx \
            --reporter=verbose

  e2e:
    name: Playwright E2E (record page + DisambiguationNotice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        run: npx playwright test
        env:
          CI: "true"