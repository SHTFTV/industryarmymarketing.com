name: IAM sole cloud publisher
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: iam-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:508b37a524219d210a67a7190beb079efda72553e0dcb9ef21d4dae8f8a7686b
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime regressions
        run: python -m unittest discover -s scripts/iam -p 'test_*.py' -v
      - name: Install matching verifier package (browsers and system dependencies are pinned in image)
        run: |
          python -m pip install --retries 3 --timeout 30 pillow==12.0.0 playwright==1.56.0 tzdata
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); print("Actual Chromium launch passed"); b.close(); p.stop()'
      - name: One source-to-verified-publication transaction
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PYTHONTZPATH: ''
          IAM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/iam/run.py
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iam-publication-evidence-${{ github.run_id }}
          path: |
            operations/iam/latest-desktop.png
            operations/iam/latest-phone.png
          if-no-files-found: ignore
  report:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record actual job outcome even when browser setup or writer fails
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IAM_JOB_RESULT: ${{ needs.publish.result }}
        run: python scripts/iam/report_execution.py
