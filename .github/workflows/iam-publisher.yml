name: IAM sole cloud publisher
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iam-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime regressions
        run: python -m unittest discover -s scripts/iam -p 'test_*.py' -v
      - name: Install browser and image verifier
        run: |
          python -m pip install pillow==12.0.0 playwright==1.56.0 tzdata
          python -m playwright install --with-deps chromium
      - name: One source-to-verified-publication transaction
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PYTHONTZPATH: ''
          IAM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/iam/run.py
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iam-publication-evidence-${{ github.run_id }}
          path: |
            operations/iam/latest-desktop.png
            operations/iam/latest-phone.png
          if-no-files-found: ignore
