name: IAM sole cloud publisher
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iam-publisher.yml'
      - 'scripts/iam/**'
      - 'scripts/iam/approved_launches.py'
      - 'scripts/iam/test_approved_launches.py'
      - 'scripts/iam/run.py'
      - 'scripts/iam/prebuild.py'
      - 'scripts/iam/recovery.py'
      - 'scripts/iam/verify_writer.py'
      - 'scripts/iam/verify_production.py'
      - 'scripts/iam/test_recovery.py'
      - 'docs/IAM-SOT.md'
      - 'operations/iam/build-contract.json'
      - 'operations/iam/approved-launches.json'
      - 'operations/iam/approved-launches/**'
permissions:
  contents: write
  actions: read
concurrency:
  group: iam-publish
  cancel-in-progress: false
jobs:
  publish:
    outputs:
      executed: ${{ steps.decide.outputs.executed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check cadence without model or browser work
        id: decide
        run: python scripts/iam/poll_due.py
      - name: Runtime regressions
        if: steps.decide.outputs.executed == 'true'
        run: python -m unittest discover -s scripts/iam -p 'test_*.py' -v
      - name: Install verifier library and use the runner existing Chrome
        if: steps.decide.outputs.executed == 'true'
        run: |
          python -m pip install --retries 3 --timeout 30 pillow==12.0.0 playwright==1.56.0 tzdata
          python -c 'import os,shutil; from playwright.sync_api import sync_playwright; executable=shutil.which("google-chrome"); assert executable, "Runner Chrome missing"; open(os.environ["GITHUB_ENV"],"a").write("IAM_BROWSER_EXECUTABLE_PATH="+executable+"\n"); p=sync_playwright().start(); b=p.chromium.launch(executable_path=executable); print("Actual installed Chrome launch passed",b.version); b.close(); p.stop()'
      - name: Measure canonical source reaching actual production
        if: steps.decide.outputs.executed == 'true'
        continue-on-error: true
        env:
          IAM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/iam/verify_production.py
      - name: Measure installed IAM generation and independent factual audit
        if: steps.decide.outputs.executed == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          IAM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/iam/verify_writer.py
      - name: Persist measured prerequisite evidence
        if: always() && steps.decide.outputs.executed == 'true'
        run: |
          PYTHONPATH=scripts/iam python -c "from run import persist; persist('IAM: retain measured source and service prerequisite evidence')"
      - name: One source-to-verified-publication transaction
        if: steps.decide.outputs.executed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PYTHONTZPATH: ''
          IAM_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/iam/run.py
      - name: Preserve actual browser evidence
        if: always() && steps.decide.outputs.executed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iam-publication-evidence-${{ github.run_id }}
          path: |
            operations/iam/latest-desktop.png
            operations/iam/latest-phone.png
          if-no-files-found: ignore
  report:
    needs: publish
    if: always() && (needs.publish.outputs.executed == 'true' || needs.publish.result != 'success' || github.event_name != 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record actual job outcome even when browser setup or writer fails
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IAM_JOB_RESULT: ${{ needs.publish.result }}
        run: python scripts/iam/report_execution.py


