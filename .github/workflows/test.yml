name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]
    name: vitest (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Compute lockfile hash
        id: lockhash
        run: |
          # hashFiles() in GitHub expressions uses SHA-256 of file contents;
          # for a single lockfile, sha256sum produces the same digest used
          # in the setup-node cache key.
          HASH=$(sha256sum package-lock.json | awk '{print $1}')
          SHORT="${HASH:0:12}"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "package-lock.json sha256: $HASH"
      - name: Report npm cache restore result
        id: cache-report
        env:
          LOCK_HASH: ${{ steps.lockhash.outputs.hash }}
          LOCK_SHORT: ${{ steps.lockhash.outputs.short }}
        run: |
          HIT='${{ steps.setup-node.outputs.cache-hit }}'
          # Reconstruct the setup-node cache key. setup-node v4 uses:
          #   node-cache-<os>-<arch>-npm-<hashFiles(package-lock.json)>
          CACHE_KEY="node-cache-${RUNNER_OS}-${RUNNER_ARCH}-npm-${LOCK_HASH}"
          echo "setup-node cache-hit output: '${HIT:-<empty>}'"
          echo "reconstructed cache key: $CACHE_KEY"
          if [ "$HIT" = "true" ]; then
            STATUS="hit"
            ICON="✅ HIT"
            echo "::notice title=npm cache::HIT key=$CACHE_KEY"
          else
            STATUS="miss"
            ICON="❌ MISS"
            echo "::notice title=npm cache::MISS key=$CACHE_KEY (no exact match — will save at job end)"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          # Per-job summary with traceability fields
          {
            echo "### npm cache — Node ${{ matrix.node-version }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | $ICON |"
            echo "| Node | ${{ matrix.node-version }} |"
            echo "| Runner | \`${RUNNER_OS}/${RUNNER_ARCH}\` |"
            echo "| Lockfile sha256 | \`${LOCK_HASH}\` |"
            echo "| Cache key | \`${CACHE_KEY}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Persist for the aggregate summary job
          mkdir -p cache-report
          {
            echo "status=$STATUS"
            echo "node=${{ matrix.node-version }}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "lock_hash=$LOCK_HASH"
            echo "lock_short=$LOCK_SHORT"
            echo "key=$CACHE_KEY"
          } > "cache-report/node-${{ matrix.node-version }}.env"
      - name: Upload cache report
        uses: actions/upload-artifact@v4
        with:
          name: cache-report-node-${{ matrix.node-version }}
          path: cache-report/
          retention-days: 1
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test

  cache-summary:
    name: npm cache hit rate
    runs-on: ubuntu-latest
    needs: vitest
    if: always()
    steps:
      - name: Download all cache reports
        uses: actions/download-artifact@v4
        with:
          path: cache-reports
          pattern: cache-report-node-*
          merge-multiple: true
      - name: Aggregate hit rate
        run: |
          shopt -s nullglob
          files=(cache-reports/node-*.env)
          total=${#files[@]}
          hits=0
          rows=""
          for f in "${files[@]}"; do
            # shellcheck disable=SC1090
            status="" node="" runner="" lock_short="" key=""
            while IFS='=' read -r k v; do
              case "$k" in
                status) status="$v" ;;
                node) node="$v" ;;
                runner) runner="$v" ;;
                lock_short) lock_short="$v" ;;
                key) key="$v" ;;
              esac
            done < "$f"
            if [ "$status" = "hit" ]; then
              hits=$((hits + 1))
              icon="✅ HIT"
            else
              icon="❌ MISS"
            fi
            rows+="| ${node} | ${icon} | \`${runner}\` | \`${lock_short}\` | \`${key}\` |"$'\n'
          done
          if [ "$total" -gt 0 ]; then
            rate=$(awk -v h="$hits" -v t="$total" 'BEGIN{printf "%.0f", (h/t)*100}')
          else
            rate=0
          fi
          {
            echo "## npm cache hit rate"
            echo ""
            echo "**${hits}/${total} jobs hit the cache (${rate}%)**"
            echo ""
            if [ "$total" -gt 0 ]; then
              echo "| Node | Result | Runner | Lock (short) | Cache key |"
              echo "| --- | --- | --- | --- | --- |"
              printf "%s" "$rows"
            else
              echo "_No cache reports found._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "npm cache hit rate: ${hits}/${total} (${rate}%)"
