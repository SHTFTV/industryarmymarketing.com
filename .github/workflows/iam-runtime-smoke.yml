name: IAM read-only installed-browser verification
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iam-runtime-smoke.yml'
      - 'scripts/iam/smoke_runner.py'
      - 'docs/IAM-SOT.md'
      - 'operations/iam/build-contract.json'
permissions:
  contents: read
concurrency:
  group: iam-runtime-readonly-check
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verifier library without container, browser download or apt
        run: python -m pip install --retries 2 --timeout 30 playwright==1.56.0
      - name: Verify actual IAM production with installed Chrome
        run: python scripts/iam/smoke_runner.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iam-readonly-runner-proof
          path: operations/iam/runner-smoke/
          if-no-files-found: ignore
          retention-days: 7
