name: SEO deploy checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seo-deploy-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      GOOGLE_SEARCH_CONSOLE_API_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build (generates sitemap + prerender)
        id: build
        run: bun run build

      - name: Redirect regression tests
        id: redirect_tests
        run: bunx vitest run src/test/legacy-redirects.test.tsx

      - name: Sitemap validation
        id: sitemap
        run: bun run validate:sitemap

      - name: robots.txt / sitemap.xml / blog consistency
        id: consistency
        run: bunx tsx scripts/seo-consistency-check.ts

      - name: Canonical + JSON-LD check
        id: canonical_jsonld
        run: bun run seo:check

      - name: Prerender performance budgets
        id: perf
        run: bunx tsx scripts/perf-budget.ts

      - name: Legacy paths not prerendered
        id: legacy_not_prerendered
        run: bunx tsx scripts/check-legacy-not-prerendered.ts --annotate

      - name: Prerender HTML SEO check (blog + newest posts)
        id: prerender_check
        run: bun run prerender:check 2>&1 | tee prerender-html-check.log

      - name: Real-HTTP redirect chain validator
        id: redirect_chain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bunx tsx scripts/redirect-chain-validator.ts \
            --ua-matrix --annotate \
            --json redirect-chain-report.json \
            --summary redirect-chain-summary.json
        continue-on-error: true

      - name: Render redirect chain HTML report
        id: redirect_html
        if: always() && hashFiles('redirect-chain-summary.json') != ''
        run: |
          bunx tsx scripts/redirect-report-html.ts \
            --in redirect-chain-summary.json \
            --out redirect-chain-report.html
        continue-on-error: true

      - name: Legacy live audit (post-deploy)
        id: legacy_live
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bunx tsx scripts/check-legacy-live.ts --annotate
        continue-on-error: true

      - name: Legacy redirects live integration test
        id: legacy_live_test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LEGACY_LIVE_BASE: https://www.industryarmymarketing.com
        run: bunx vitest run src/test/legacy-redirects-live.test.ts
        continue-on-error: true

      - name: Restore previous SEO snapshot
        uses: actions/download-artifact@v4
        with:
          name: seo-snapshot
          path: .seo-snapshots
        continue-on-error: true

      - name: Rename restored snapshot to previous.json
        run: |
          mkdir -p .seo-snapshots
          if [ -f .seo-snapshots/current.json ]; then
            mv .seo-snapshots/current.json .seo-snapshots/previous.json
          fi

      - name: Generate SEO diff report
        id: seo_diff
        run: bun run seo:diff

      - name: Upload SEO diff report
        id: upload_diff
        uses: actions/upload-artifact@v4
        with:
          name: seo-diff-report
          path: |
            seo-diff-report.md
            seo-diff-report.json

      - name: Upload prerender HTML check log
        id: upload_prerender_log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-html-check-log
          path: prerender-html-check.log

      - name: Upload redirect chain reports
        id: upload_redirect_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redirect-chain-reports
          path: |
            redirect-chain-report.json
            redirect-chain-summary.json
            redirect-chain-report.html
          if-no-files-found: ignore

      - name: Ensure PR comment will have artifact URLs
        id: check_artifact_urls
        if: github.event_name == 'pull_request'
        env:
          DIFF_URL: ${{ steps.upload_diff.outputs.artifact-url }}
          LOG_URL: ${{ steps.upload_prerender_log.outputs.artifact-url }}
        run: |
          missing=0
          if [ -z "$DIFF_URL" ]; then
            echo "::error::seo-diff-report artifact URL is empty; PR comment would lose direct link"
            missing=1
          fi
          if [ -z "$LOG_URL" ]; then
            echo "::error::prerender-html-check-log artifact URL is empty; PR comment would lose direct link"
            missing=1
          fi
          exit $missing

      - name: Upload current SEO snapshot (baseline for next run)
        uses: actions/upload-artifact@v4
        with:
          name: seo-snapshot
          path: .seo-snapshots/current.json
          overwrite: true

      - name: GSC sync (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.LOVABLE_API_KEY != '' && env.GOOGLE_SEARCH_CONSOLE_API_KEY != ''
        run: bun run gsc:sync

      - name: Post CI summary comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIFF_ARTIFACT_URL: ${{ steps.upload_diff.outputs.artifact-url }}
          PRERENDER_LOG_ARTIFACT_URL: ${{ steps.upload_prerender_log.outputs.artifact-url }}
          REDIRECT_ARTIFACT_URL: ${{ steps.upload_redirect_reports.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const icon = (o) => o === 'success' ? '✅' : o === 'skipped' ? '⏭️' : '❌';
            const steps = [
              ['Build', ${{ toJSON(steps.build.outcome) }}],
              ['Redirect regression tests', ${{ toJSON(steps.redirect_tests.outcome) }}],
              ['Sitemap validation', ${{ toJSON(steps.sitemap.outcome) }}],
              ['robots/sitemap/blog consistency', ${{ toJSON(steps.consistency.outcome) }}],
              ['Canonical + JSON-LD', ${{ toJSON(steps.canonical_jsonld.outcome) }}],
              ['Prerender perf budgets', ${{ toJSON(steps.perf.outcome) }}],
              ['Legacy paths not prerendered', ${{ toJSON(steps.legacy_not_prerendered.outcome) }}],
              ['Prerender HTML SEO check', ${{ toJSON(steps.prerender_check.outcome) }}],
              ['Real-HTTP redirect chain', ${{ toJSON(steps.redirect_chain.outcome) }}],
              ['Legacy live audit', ${{ toJSON(steps.legacy_live.outcome) }}],
              ['Legacy redirects live test', ${{ toJSON(steps.legacy_live_test.outcome) }}],
              ['SEO diff report', ${{ toJSON(steps.seo_diff.outcome) }}],
              ['Artifact URLs present', ${{ toJSON(steps.check_artifact_urls.outcome) }}],
            ];
            const rows = steps
              .filter(([, o]) => o && o !== '')
              .map(([n, o]) => `| ${icon(o)} | ${n} | \`${o}\` |`)
              .join('\n');
            const runUrl = process.env.RUN_URL;
            const artifactsUrl = `${runUrl}#artifacts`;
            const diffUrl = process.env.DIFF_ARTIFACT_URL || artifactsUrl;
            const prerenderLogUrl = process.env.PRERENDER_LOG_ARTIFACT_URL || artifactsUrl;
            const redirectUrl = process.env.REDIRECT_ARTIFACT_URL || artifactsUrl;
            if (!process.env.DIFF_ARTIFACT_URL || !process.env.PRERENDER_LOG_ARTIFACT_URL) {
              core.setFailed('PR summary comment is missing direct artifact URLs for seo-diff-report.md or prerender-html-check.log');
            }
            let diffPreview = '';
            try {
              const md = fs.readFileSync('seo-diff-report.md', 'utf8').split('\n').slice(0, 30).join('\n');
              diffPreview = `\n<details><summary>SEO diff (preview — full report in artifacts)</summary>\n\n${md}\n\n</details>`;
            } catch {}
            // Per-rule redirect summary from redirect-chain-summary.json.
            let redirectSummary = '';
            try {
              const s = JSON.parse(fs.readFileSync('redirect-chain-summary.json', 'utf8'));
              const t = s.totals || {};
              const rows = (s.rules || []).map((r) => {
                const okIcon = r.ok ? '✅' : '❌';
                const exp = (r.expected?.hops || []).join(' → ');
                const act = (r.actual?.hops || []).join(' → ');
                return `| ${okIcon} | \`${r.rule}\` | ${r.ua} | \`${exp}\` | \`${act}\` | \`${r.expected?.finalUrl || ''}\` | \`${r.actual?.finalUrl || ''}\` |`;
              });
              // Show failing rules first; cap total rows to keep the comment readable.
              const failing = (s.rules || []).map((r, i) => ({ r, i })).filter(({ r }) => !r.ok).map(({ i }) => rows[i]);
              const passing = (s.rules || []).map((r, i) => ({ r, i })).filter(({ r }) => r.ok).map(({ i }) => rows[i]);
              const shown = [...failing, ...passing].slice(0, 25);
              const more = rows.length - shown.length;
              redirectSummary = [
                '',
                `<details${(t.failed || 0) > 0 ? ' open' : ''}><summary>Redirect chain summary (${t.passed || 0}/${t.cases || 0} passed, ${t.failed || 0} failed)</summary>`,
                '',
                '| Result | Rule | UA | Expected hops | Actual hops | Expected final | Actual final |',
                '| --- | --- | --- | --- | --- | --- | --- |',
                shown.join('\n'),
                more > 0 ? `\n_+${more} more rules — see [full HTML report](${redirectUrl})._` : '',
                '',
                '</details>',
              ].join('\n');
            } catch { /* redirect chain step is main-only; skip on PRs */ }
            const overall = steps.some(([, o]) => o === 'failure') ? '❌ FAIL' : '✅ PASS';
            const marker = '<!-- seo-ci-summary -->';
            const body = [
              marker,
              `### SEO deploy checks — ${overall}`,
              '',
              '| Result | Step | Outcome |',
              '| --- | --- | --- |',
              rows,
              '',
              `- 📄 **SEO diff report**: [seo-diff-report.md](${diffUrl})`,
              `- 🧪 **Prerender HTML check log**: [prerender-html-check.log](${prerenderLogUrl})`,
              `- 🔁 **Redirect chain HTML report**: [redirect-chain-report.html](${redirectUrl})`,
              `- 🗂️ **All artifacts**: ${artifactsUrl}`,
              `- 🔗 **Full run**: ${runUrl}`,
              diffPreview,
              redirectSummary,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: existing } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const prior = existing.find((c) => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }