name: Validate sitemap

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_bun_cache:
        description: "Print Bun cache contents before/after install"
        type: boolean
        default: false
      min_cache_kb:
        description: "Minimum Bun cache size (KB) required after install"
        type: string
        default: "1024"
      bun_cache_dir:
        description: "Override Bun install cache directory (leave blank for default ~/.bun/install/cache)"
        type: string
        default: ""
      debug_verbosity:
        description: "Bun cache debug verbosity (only used when debug_bun_cache is enabled)"
        type: choice
        options:
          - values
          - assertions
        default: values

permissions:
  contents: read

jobs:
  validate-sitemap:
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: ${{ inputs.bun_cache_dir || '' }}
      MIN_CACHE_KB: ${{ inputs.min_cache_kb || '1024' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate inputs
        run: |
          TRIMMED="${MIN_CACHE_KB#"${MIN_CACHE_KB%%[![:space:]]*}"}"
          TRIMMED="${TRIMMED%"${TRIMMED##*[![:space:]]}"}"
          if ! [[ "$TRIMMED" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid input::min_cache_kb must be a positive integer (got: '$MIN_CACHE_KB')"
            exit 1
          fi
          echo "MIN_CACHE_KB=$TRIMMED" >> "$GITHUB_ENV"
          echo "min_cache_kb=$TRIMMED ✓"
      - name: Validate & normalize bun_cache_dir
        id: normalize_bun_cache_dir
        run: node .github/workflows/lib/run-normalize-bun-cache-dir.cjs
      - name: Debug normalized cache dir outputs
        if: inputs.debug_bun_cache == true
        env:
          NORMALIZED: ${{ steps.normalize_bun_cache_dir.outputs.bun_cache_dir_normalized }}
          RESOLVED: ${{ steps.normalize_bun_cache_dir.outputs.bun_cache_dir_resolved }}
          VERBOSITY: ${{ inputs.debug_verbosity }}
        run: |
          echo "bun_cache_dir_normalized='${NORMALIZED}'"
          echo "bun_cache_dir_resolved='${RESOLVED}'"
          if [ "$VERBOSITY" != "assertions" ]; then
            exit 0
          fi
          # Precheck: resolved dir must exist and be writable before assertions.
          if [ ! -d "$RESOLVED" ]; then
            echo "::error::resolved cache dir does not exist: $RESOLVED"
            exit 1
          fi
          PROBE="$RESOLVED/.write-probe.$$"
          if ! ( : > "$PROBE" ) 2>/dev/null; then
            echo "::error::resolved cache dir is not writable: $RESOLVED"
            exit 1
          fi
          # Only arm cleanup once PROBE was actually created by us.
          trap '[ -n "$PROBE" ] && [ -f "$PROBE" ] && rm -f "$PROBE"' EXIT
          echo "✓ resolved cache dir exists and is writable"
          if [ -z "$NORMALIZED" ]; then
            DEFAULT="$HOME/.bun/install/cache"
            echo "input was blank → using fallback default: $DEFAULT"
            if [ "$RESOLVED" = "$DEFAULT" ]; then
              echo "✓ resolved matches expected default"
            else
              echo "::error::resolved ($RESOLVED) does not match expected default ($DEFAULT)"
              exit 1
            fi
          else
            echo "input was provided → resolved equals normalized"
            if [ "$RESOLVED" = "$NORMALIZED" ]; then
              echo "✓ resolved matches normalized"
            else
              echo "::error::resolved ($RESOLVED) does not match normalized ($NORMALIZED)"
              exit 1
            fi
          fi
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.normalize_bun_cache_dir.outputs.bun_cache_dir_resolved }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Debug Bun cache (before install)
        if: inputs.debug_bun_cache == true
        env:
          CACHE_DIR: ${{ steps.normalize_bun_cache_dir.outputs.bun_cache_dir_resolved }}
        run: |
          echo "Bun cache dir: $CACHE_DIR"
          if [ -d "$CACHE_DIR" ]; then
            echo "── cache size ──"; du -sh "$CACHE_DIR" || true
            echo "── top entries ──"; ls -lah "$CACHE_DIR" | head -n 20 || true
            echo "── entry count ──"; find "$CACHE_DIR" -mindepth 1 -maxdepth 1 | wc -l
          else
            echo "cache dir not present (cold cache)"
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Bun cache populated
        env:
          CACHE_DIR: ${{ steps.normalize_bun_cache_dir.outputs.bun_cache_dir_resolved }}
        run: |
          if [ ! -d "$CACHE_DIR" ]; then
            echo "::error::Bun cache directory missing at $CACHE_DIR after install"
            exit 1
          fi
          SIZE_KB=$(du -sk "$CACHE_DIR" | awk '{print $1}')
          ENTRIES=$(find "$CACHE_DIR" -mindepth 1 -maxdepth 1 | wc -l)
          echo "Bun cache: ${SIZE_KB} KB across ${ENTRIES} entries at $CACHE_DIR"
          if [ "$ENTRIES" -lt 1 ]; then
            echo "::error::Bun cache directory is empty after install"
            exit 1
          fi
          if [ "$SIZE_KB" -lt "$MIN_CACHE_KB" ]; then
            echo "::error::Bun cache size ${SIZE_KB} KB is below minimum ${MIN_CACHE_KB} KB"
            exit 1
          fi
      - name: Debug Bun cache (after install)
        if: inputs.debug_bun_cache == true
        env:
          CACHE_DIR: ${{ steps.normalize_bun_cache_dir.outputs.bun_cache_dir_resolved }}
        run: |
          if [ -d "$CACHE_DIR" ]; then
            echo "── cache size ──"; du -sh "$CACHE_DIR" || true
            echo "── top entries ──"; ls -lah "$CACHE_DIR" | head -n 20 || true
            echo "── entry count ──"; find "$CACHE_DIR" -mindepth 1 -maxdepth 1 | wc -l
          else
            echo "cache dir still not present after install — unexpected"
            exit 1
          fi
      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'bun.lock', 'bun.lockb') }}-${{ hashFiles('src/**', 'scripts/**', '*.ts', '*.tsx') }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'bun.lock', 'bun.lockb') }}-
            eslint-${{ runner.os }}-
      - name: Lint
        run: bun run lint -- --cache --cache-location .eslintcache --cache-strategy content
      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig*.json', 'bun.lock', 'bun.lockb') }}-${{ hashFiles('src/**', 'scripts/**', '*.ts', '*.tsx') }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('tsconfig*.json', 'bun.lock', 'bun.lockb') }}-
            tsc-${{ runner.os }}-
      - name: Typecheck
        run: bunx tsc --noEmit --incremental --tsBuildInfoFile .tsbuildinfo
      - name: Cache Vite dependency prebundle
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite/deps
            node_modules/.vite/deps_temp_*
          key: vite-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            vite-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts') }}-
            vite-deps-${{ runner.os }}-
      - name: Cache Vite build output
        uses: actions/cache@v4
        with:
          path: |
            dist
            node_modules/.vite
          key: vite-build-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts', 'tsconfig*.json', 'tailwind.config.ts', 'postcss.config.js', 'index.html') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            vite-build-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts', 'tsconfig*.json', 'tailwind.config.ts', 'postcss.config.js', 'index.html') }}-
            vite-build-${{ runner.os }}-
      - name: Build site
        run: bun run build
      - name: Start preview server
        run: |
          bunx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break || sleep 1
          done
          curl -sf http://localhost:4173/ > /dev/null
      - name: Validate sitemap
        run: bunx tsx scripts/validate-sitemap.ts http://localhost:4173
      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" 2>/dev/null || true; fi
          if [ -f preview.log ]; then echo "── preview.log ──"; cat preview.log; fi
