name: Validate sitemap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        run: bun run build
      - name: Start preview server
        run: |
          bunx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break || sleep 1
          done
          curl -sf http://localhost:4173/ > /dev/null
      - name: Validate sitemap
        run: bunx tsx scripts/validate-sitemap.ts http://localhost:4173
      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" 2>/dev/null || true; fi
          if [ -f preview.log ]; then echo "── preview.log ──"; cat preview.log; fi
